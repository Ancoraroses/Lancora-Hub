<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a1f2b">
<title>Control de Bebida — L'Àncora</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>🍷</text></svg>">
<style>
  :root {
    --bg: #f4efe9; --card: #ffffff; --text: #2b2420; --dim: #746b62; --border: #e3dad0;
    --accent: #7a1f2b; --gold: #b08d57; --danger: #b3402a; --ok: #3a8f5c; --warn: #d19a2a;
    --c-botella: #7a1f2b; --c-copa: #a13b46; --c-cerveza: #b8862b;
    --c-refresco: #2f7a8c; --c-vermut: #8a5a2b; --c-combinado: #4a4a6a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17130f; --card: #241d18; --text: #f0e9e1; --dim: #a89a8d; --border: #3a2f27; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh; min-height: 100dvh;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button { font-family: inherit; touch-action: manipulation; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 14px clamp(12px, 3vw, 28px) 32px; }

  /* Cabecera */
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .ttl h1 { margin: 0 0 3px; font-size: clamp(1.05rem, 2.4vw, 1.4rem); font-weight: 700; }
  .sub { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--dim); flex-wrap: wrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); display: inline-block; }
  .dot.ok { background: var(--ok); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .ghost { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 10px; padding: 9px 13px; font-size: .85rem; font-weight: 600; min-height: 40px; }

  /* Layout adaptable */
  .layout { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }
  @media (min-width: 900px) {
    .layout { grid-template-columns: 320px 1fr; gap: 22px; }
    .side { position: sticky; top: 14px; }
  }
  .side { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; }

  /* Medidor */
  .gtop { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .big { font-size: clamp(1.8rem, 4vw, 2.4rem); font-weight: 800; font-variant-numeric: tabular-nums; }
  .lbl { font-size: .78rem; color: var(--dim); }
  .track { height: 14px; border-radius: 7px; background: var(--bg); border: 1px solid var(--border); overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--gold); transition: width .18s ease; }
  .fill.over { background: var(--danger); }
  .gfoot { display: flex; justify-content: space-between; gap: 8px; margin-top: 7px; font-size: .76rem; color: var(--dim); flex-wrap: wrap; }
  .pill { margin-top: 6px; font-size: .74rem; color: var(--dim); }

  /* Avisos */
  .banner { border-radius: 14px; padding: 12px 14px; font-size: .86rem; line-height: 1.4; display: flex; flex-direction: column; gap: 8px; }
  .banner.warn { background: #4a3416; color: #ffe6b3; border: 1px solid #7a5a22; }
  .banner.danger { background: #4a1a16; color: #ffd2c9; border: 1px solid #7a2e22; }
  .banner b { font-size: .9rem; }
  .banner button { align-self: flex-start; background: rgba(255,255,255,.18); color: inherit; border: 0; border-radius: 10px; padding: 9px 13px; font-size: .82rem; font-weight: 700; min-height: 40px; }

  /* Bebidas */
  .section-label { font-size: .76rem; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; margin: 2px 2px 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: clamp(8px, 1.6vw, 14px); }
  .grid + .section-label { margin-top: 18px; }
  .drink { border-radius: 18px; padding: clamp(10px, 2vw, 16px); color: #fff; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; -webkit-user-select: none; user-select: none; }
  .drink.wide { grid-column: 1 / -1; }
  .emoji { font-size: clamp(1.5rem, 3.4vw, 2rem); line-height: 1; }
  .name { font-size: clamp(.84rem, 1.7vw, 1rem); font-weight: 700; }
  .cost { font-size: .7rem; opacity: .85; margin-bottom: 4px; }
  .count { font-size: clamp(1.6rem, 4.2vw, 2.3rem); font-weight: 800; margin: 2px 0 8px; font-variant-numeric: tabular-nums; }
  .qty { display: flex; gap: 8px; width: 100%; }
  .qty button { flex: 1; border: 0; border-radius: 12px; background: rgba(255,255,255,.22); color: #fff; font-size: 1.6rem; font-weight: 800; min-height: clamp(50px, 9vh, 70px); }
  .qty button.plus { flex: 1.5; background: rgba(255,255,255,.36); }
  .qty button:active { background: rgba(255,255,255,.5); }
  .qty button:disabled { opacity: .35; }

  .undo { width: 100%; margin-top: 16px; border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 12px; padding: 13px; font-size: .92rem; font-weight: 600; min-height: 48px; }
  .undo:disabled { opacity: .4; }
  .hint { text-align: center; font-size: .72rem; color: var(--dim); margin-top: 6px; }

  /* Sin evento / carga */
  .center { max-width: 420px; margin: 8vh auto 0; }
  .center h2 { margin: 0 0 4px; font-size: 1.15rem; }
  .center p { margin: 0 0 6px; color: var(--dim); font-size: .88rem; }

  /* Modales */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 18px; z-index: 50; overflow-y: auto; }
  .modal { width: 100%; max-width: 400px; }
  .mtitle { font-weight: 700; font-size: 1.05rem; }
  .mnote { margin: 6px 0 0; font-size: .82rem; color: var(--dim); line-height: 1.4; }
  label { display: block; font-size: .8rem; color: var(--dim); margin: 12px 0 4px; }
  input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 1rem; }
  .macts { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .macts button { flex: 1 1 110px; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-weight: 700; font-size: .92rem; min-height: 46px; }
  .macts button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #3b1a16; color: #ffd2c9; padding: 10px 16px; border-radius: 12px; font-size: .85rem; z-index: 60; max-width: 90vw; text-align: center; }

  @media (max-height: 500px) and (orientation: landscape) {
    .wrap { padding-top: 8px; }
    .qty button { min-height: 44px; }
  }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, runTransaction, set, update, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({ databaseURL: "https://lancora-social-default-rtdb.europe-west1.firebasedatabase.app" });
const db = getDatabase(app);
const EVT = ref(db, "bebida/actual");

const CATS = [
  { key: "vino_botella", label: "Botella de vino", emoji: "🍾", cost: 3, color: "--c-botella" },
  { key: "copa_vino",    label: "Copa de vino",    emoji: "🍷", cost: 1, color: "--c-copa" },
  { key: "cerveza",      label: "Cerveza",         emoji: "🍺", cost: 1, color: "--c-cerveza" },
  { key: "refresco",     label: "Refresco",        emoji: "🥤", cost: 1, color: "--c-refresco" },
  { key: "vermut",       label: "Vermut",          emoji: "🧉", cost: 1, color: "--c-vermut" }
];
const EXTRA = [
  { key: "combinado", label: "Combinado / Cóctel", emoji: "🍸", cost: 0, color: "--c-combinado" }
];

let ev = null, loaded = false, online = false, curId = null, bannerKey = "";
const myLog = [];

const num = (o, k) => Number(o && o[k]) || 0;
const fmt1 = n => (Math.round(n * 10) / 10).toFixed(1);

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(c => c != null && e.append(c));
  return e;
}

/* ---------- Construcción de la interfaz (una sola vez) ---------- */
const R = {};
const root = document.getElementById("root");

R.title = h("h1", { text: "Cargando…" });
R.people = h("span");
R.dot = h("span", { class: "dot" });
R.conn = h("span");
R.actions = h("div", { class: "actions", hidden: true },
  h("button", { class: "ghost", text: "Editar", onclick: openEdit }),
  h("button", { class: "ghost", text: "+ Créditos", onclick: openCredits }),
  h("button", { class: "ghost", text: "Nuevo", onclick: openNew })
);
root.append(h("header", { class: "top" },
  h("div", { class: "ttl" }, R.title, h("div", { class: "sub" }, R.people, R.dot, R.conn)),
  R.actions
));

R.loading = h("div", { class: "center" }, h("p", { text: "Conectando…" }));
R.setup = buildSetup();
root.append(R.loading, R.setup);

R.big = h("div", { class: "big" });
R.bigLbl = h("div", { class: "lbl" });
R.used = h("div", { class: "lbl" });
R.fill = h("div", { class: "fill" });
R.foot1 = h("span");
R.pill = h("div", { class: "pill" });
R.banner = h("div");
const gauge = h("section", { class: "card" },
  h("div", { class: "gtop" }, h("div", {}, R.big, R.bigLbl), R.used),
  h("div", { class: "track" }, R.fill),
  h("div", { class: "gfoot" }, R.foot1, h("span", { text: "1 botella = 3 cr. · resto = 1 cr." })),
  R.pill
);

function drinkCard(c, isExtra) {
  const count = h("span", { class: "count", text: "0" });
  const minus = h("button", { class: "minus", text: "−", "aria-label": "Quitar " + c.label, onclick: () => bump(c.key, isExtra, -1) });
  const plus = h("button", { class: "plus", text: "+", "aria-label": "Añadir " + c.label, onclick: () => bump(c.key, isExtra, 1) });
  const el = h("div", { class: "drink" + (isExtra ? " wide" : ""), style: `background:var(${c.color})` },
    h("span", { class: "emoji", text: c.emoji }),
    h("span", { class: "name", text: c.label }),
    h("span", { class: "cost", text: isExtra ? "no gasta crédito" : c.cost + " cr." }),
    count,
    h("div", { class: "qty" }, minus, plus)
  );
  return { el, count, minus, key: c.key, isExtra };
}
const cardsInc = CATS.map(c => drinkCard(c, false));
const cardsExtra = EXTRA.map(c => drinkCard(c, true));

R.undo = h("button", { class: "undo", text: "↩︎ Deshacer mi última pulsación", onclick: undo });
R.layout = h("div", { class: "layout", hidden: true },
  h("aside", { class: "side" }, gauge, R.banner),
  h("main", {},
    h("div", { class: "section-label", text: "Incluido en el menú" }),
    h("div", { class: "grid" }, cardsInc.map(c => c.el)),
    h("div", { class: "section-label", text: "Aparte (no incluido)" }),
    h("div", { class: "grid" }, cardsExtra.map(c => c.el)),
    R.undo,
    h("div", { class: "hint", text: "Solo deshace lo que has apuntado tú en este dispositivo." })
  )
);
root.append(R.layout);

function buildSetup() {
  const name = h("input", { type: "text", placeholder: "p.ej. Boda García", id: "s_name" });
  const people = h("input", { type: "number", inputmode: "numeric", min: "1", placeholder: "p.ej. 30", id: "s_people" });
  return h("section", { class: "card center", hidden: true },
    h("h2", { text: "Nuevo evento" }),
    h("p", { text: "No hay ningún evento activo. Al crearlo aparecerá en todos los dispositivos." }),
    h("label", { for: "s_name", text: "Nombre del evento (opcional)" }), name,
    h("label", { for: "s_people", text: "Número de personas" }), people,
    h("div", { class: "macts" }, h("button", { class: "primary", text: "Empezar", onclick: () => {
      const n = parseInt(people.value, 10);
      if (!n || n <= 0) { people.focus(); return; }
      startEvent(name.value.trim(), n);
    } }))
  );
}

/* ---------- Pintado (actualiza en sitio, sin reconstruir) ---------- */
function paintConn() {
  R.dot.className = "dot" + (online ? " ok" : "");
  R.conn.textContent = online ? "Sincronizado" : "Sin conexión — se guardará al volver";
}
function paintUndo() { R.undo.disabled = myLog.length === 0; }

function paint() {
  R.loading.hidden = loaded;
  R.setup.hidden = !loaded || !!ev;
  R.layout.hidden = !ev;
  R.actions.hidden = !ev;
  paintUndo();
  if (!ev) {
    R.title.textContent = loaded ? "Sin evento activo" : "Cargando…";
    R.people.textContent = "";
    return;
  }
  if (ev.id !== curId) { curId = ev.id; myLog.length = 0; paintUndo(); }

  const people = Number(ev.people) || 0;
  const extraC = Number(ev.extraCredits) || 0;
  const total = people + extraC;
  let used = 0;
  for (const c of CATS) used += num(ev.counts, c.key) * c.cost;
  const remaining = total - used;
  const over = remaining < 0;
  const pct = total > 0 ? Math.min(100, Math.max(0, used / total * 100)) : 0;

  R.title.textContent = ev.name || "Evento sin nombre";
  R.people.textContent = people + " personas ·";
  R.big.textContent = (over ? "−" : "") + Math.abs(remaining) + " cr.";
  R.bigLbl.textContent = over ? "excedido sobre lo incluido" : "incluido restante";
  R.used.textContent = used + " / " + total + " cr. usados";
  R.fill.style.width = pct + "%";
  R.fill.className = "fill" + (over ? " over" : "");
  R.foot1.textContent = fmt1(remaining / 3) + " botellas equiv. restantes";
  R.pill.textContent = extraC ? "+" + extraC + " cr. ampliados sobre las " + people + " personas" : "";
  R.pill.hidden = !extraC;

  for (const c of cardsInc) { const n = num(ev.counts, c.key); c.count.textContent = n; c.minus.disabled = n === 0; }
  for (const c of cardsExtra) { const n = num(ev.extra, c.key); c.count.textContent = n; c.minus.disabled = n === 0; }

  const kind = over ? "danger" : (total > 0 && remaining <= 2 ? "warn" : "none");
  const key = kind + ":" + remaining;
  if (key !== bannerKey) {
    bannerKey = key;
    R.banner.replaceChildren();
    if (kind === "danger") {
      R.banner.append(h("div", { class: "banner danger" },
        h("b", { text: "⚠️ Sin crédito incluido — " + Math.abs(remaining) + " cr. de más" }),
        h("div", { text: "Dile a la mesa que lo incluido en el menú se ha agotado: a partir de ahora cualquier bebida se cobra aparte, según carta. Si el grupo prefiere seguir con bebida incluida, amplía créditos." }),
        h("button", { text: "Ampliar créditos", onclick: openCredits })
      ));
    } else if (kind === "warn") {
      R.banner.append(h("div", { class: "banner warn" },
        h("b", { text: "⏳ Quedan " + remaining + " cr. incluidos" }),
        h("div", { text: "Avisa pronto a la mesa: está a punto de agotarse la bebida incluida en el menú." }),
        h("button", { text: "Ampliar créditos", onclick: openCredits })
      ));
    }
  }
}

/* ---------- Escrituras atómicas (transacciones) ---------- */
function fail() {
  document.querySelector(".toast")?.remove();
  const t = h("div", { class: "toast", text: "No se pudo guardar. Revisa la conexión." });
  document.body.append(t);
  setTimeout(() => t.remove(), 3500);
}

function bump(key, isExtra, delta) {
  if (!ev) return;
  const path = "bebida/actual/" + (isExtra ? "extra" : "counts") + "/" + key;
  myLog.push({ kind: "count", path, delta });
  if (myLog.length > 80) myLog.shift();
  paintUndo();
  if (navigator.vibrate) navigator.vibrate(12);
  runTransaction(ref(db, path), v => Math.max(0, (Number(v) || 0) + delta)).catch(fail);
}

function addCredits(n) {
  myLog.push({ kind: "credit", amount: n });
  if (myLog.length > 80) myLog.shift();
  paintUndo();
  runTransaction(ref(db, "bebida/actual/extraCredits"), v => Math.max(0, (Number(v) || 0) + n)).catch(fail);
}

function undo() {
  const last = myLog.pop();
  if (!last) return;
  paintUndo();
  if (last.kind === "credit") {
    runTransaction(ref(db, "bebida/actual/extraCredits"), v => Math.max(0, (Number(v) || 0) - last.amount)).catch(fail);
  } else {
    runTransaction(ref(db, last.path), v => Math.max(0, (Number(v) || 0) - last.delta)).catch(fail);
  }
}

function startEvent(name, people) {
  const zero = {};
  CATS.forEach(c => zero[c.key] = 0);
  const extra = {};
  EXTRA.forEach(c => extra[c.key] = 0);
  const now = Date.now();
  if (ev) push(ref(db, "bebida/historial"), { ...ev, cerradoEn: now }).catch(fail);
  set(EVT, { id: now, name, people, extraCredits: 0, counts: zero, extra, createdAt: now }).catch(fail);
}

/* ---------- Modales ---------- */
function modal({ title, note, quick = [], fields = [], actions = [] }) {
  const inputs = {};
  const close = () => ov.remove();
  const run = async (a) => {
    const vals = {};
    for (const k in inputs) vals[k] = inputs[k].value;
    if (a.run && (await a.run(vals)) === false) return;
    close();
  };
  const body = [h("div", { class: "mtitle", text: title })];
  if (note) body.push(h("p", { class: "mnote", text: note }));
  if (quick.length) body.push(h("div", { class: "macts" }, quick.map(a => h("button", { class: a.kind || "", text: a.label, onclick: () => run(a) }))));
  for (const f of fields) {
    const inp = h("input", { type: f.type || "text", inputmode: f.inputmode, placeholder: f.placeholder || "", value: f.value ?? "", id: "f_" + f.id });
    inputs[f.id] = inp;
    body.push(h("label", { for: "f_" + f.id, text: f.label }), inp);
  }
  body.push(h("div", { class: "macts" }, actions.map(a => h("button", { class: a.kind || "", text: a.label, onclick: () => run(a) }))));
  const ov = h("div", { class: "overlay", onclick: e => { if (e.target === ov) close(); } }, h("div", { class: "card modal" }, body));
  document.body.append(ov);
  const first = Object.values(inputs)[0];
  if (first && !quick.length) first.focus();
}

const posInt = v => { const n = parseInt(v, 10); return n > 0 ? n : 0; };

function openEdit() {
  if (!ev) return;
  modal({
    title: "Editar evento",
    note: "Los contadores de bebida se mantienen tal cual.",
    fields: [
      { id: "name", label: "Nombre del evento (opcional)", value: ev.name || "" },
      { id: "people", label: "Número de personas", type: "number", inputmode: "numeric", value: ev.people }
    ],
    actions: [
      { label: "Cancelar" },
      { label: "Guardar", kind: "primary", run: v => {
        const n = posInt(v.people);
        if (!n) return false;
        update(EVT, { name: v.name.trim(), people: n }).catch(fail);
      } }
    ]
  });
}

function openCredits() {
  if (!ev) return;
  modal({
    title: "Ampliar créditos incluidos",
    note: "Úsalo cuando el grupo acepta pagar por más bebida incluida (por ejemplo, una botella más para todos).",
    quick: [
      { label: "+1 cr.", run: () => addCredits(1) },
      { label: "+3 cr. (1 botella)", kind: "primary", run: () => addCredits(3) }
    ],
    fields: [{ id: "n", label: "Otra cantidad (negativa para restar)", type: "number", inputmode: "numeric", placeholder: "p.ej. 6" }],
    actions: [
      { label: "Cerrar" },
      { label: "Añadir", kind: "primary", run: v => {
        const n = parseInt(v.n, 10);
        if (!n) return false;
        addCredits(n);
      } }
    ]
  });
}

function openNew() {
  modal({
    title: "Nuevo evento",
    note: ev ? "El evento actual se archiva y los contadores se ponen a cero en TODOS los dispositivos." : "",
    fields: [
      { id: "name", label: "Nombre del evento (opcional)" },
      { id: "people", label: "Número de personas", type: "number", inputmode: "numeric", placeholder: "p.ej. 30" }
    ],
    actions: [
      { label: "Cancelar" },
      { label: ev ? "Archivar y empezar" : "Empezar", kind: "primary", run: v => {
        const n = posInt(v.people);
        if (!n) return false;
        startEvent(v.name.trim(), n);
      } }
    ]
  });
}

/* ---------- Sincronización en tiempo real ---------- */
onValue(ref(db, ".info/connected"), s => { online = !!s.val(); paintConn(); });
onValue(EVT, s => { ev = s.val(); loaded = true; paint(); }, fail);
paintConn();
paint();
</script>
